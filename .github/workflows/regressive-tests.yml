name: Testes Regressivos

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Filtro de testes (Test ou Tag)'
        required: false
        default: 'regressive'
      filter-type:
        description: 'Tipo de filtro'
        required: true
        default: 'tag'
        type: choice
        options:
          - tag
          - test-name

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Google Chrome and matching ChromeDriver
        run: |
          sudo apt update
          sudo apt install -y wget gnupg unzip curl
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt update
          sudo apt install -y google-chrome-stable
          
          CHROME_VER=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+' | head -1)
          CHROME_MAJOR=$(echo $CHROME_VER | cut -d. -f1)
          LATEST=$(curl -sS "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_MAJOR")
          echo "Chrome version: $CHROME_VER, using chromedriver release: $LATEST"
          wget -q "https://chromedriver.storage.googleapis.com/${LATEST}/chromedriver_linux64.zip"
          unzip -q chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          rm chromedriver_linux64.zip

      - name: Rodar testes por tag
        if: github.event.inputs.filter-type == 'tag'
        run: mvn -B -Dselenide.headless=true -Dwebdriver.chrome.driver=/usr/local/bin/chromedriver clean test -Dgroups=${{ github.event.inputs.test-filter }}

      - name: Rodar testes por nome
        if: github.event.inputs.filter-type == 'test-name'
        run: |
          TEST_FILTER="${{ github.event.inputs.test-filter }}"
          
          # se vazio ou valor padrão, executa tudo
          if [ -z "$TEST_FILTER" ] || [ "$TEST_FILTER" = "regressive" ]; then
            mvn -B -Dselenide.headless=true -Dwebdriver.chrome.driver=/usr/local/bin/chromedriver clean test
          else
            # se contiver '.' assume FQCN, caso contrário envolve com curingas
            if [[ "$TEST_FILTER" == *.* ]]; then
              mvn -B -Dselenide.headless=true -Dwebdriver.chrome.driver=/usr/local/bin/chromedriver -Dtest="$TEST_FILTER" clean test
            else
              mvn -B -Dselenide.headless=true -Dwebdriver.chrome.driver=/usr/local/bin/chromedriver -Dtest="*$TEST_FILTER*" clean test
            fi
          fi

      - name: Gerar relatório Allure
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy relatório
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
