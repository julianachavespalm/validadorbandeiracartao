name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 8 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Selecione quais testes rodar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke_tests
          - regression_tests

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          TEST_SCOPE: ${{ github.event.inputs.test_scope || 'all' }}
        run: |
          $testCommand = "mvn clean test"
          if ($env:TEST_SCOPE -eq "smoke_tests") {
            $testCommand += " -Dgroups=smoke"
          } elseif ($env:TEST_SCOPE -eq "regression_tests") {
            $testCommand += " -Dgroups=regression"
          }
          Invoke-Expression $testCommand

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          files: target/surefire-reports/*.xml
          check_name: Test Results

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 30

      - name: Comment PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const testPassed = context.job.status === 'success';
            const emoji = testPassed ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} Testes executados! Status: **${context.job.status.toUpperCase()}**`
            });
